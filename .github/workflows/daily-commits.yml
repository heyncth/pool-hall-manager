name: Daily Commit Scheduler

on:
  schedule:
    # Runs at midnight, 6 AM, 12 PM, and 6 PM UTC daily.
    # The Python script's _should_skip() uses a hash of today's date
    # to pick exactly one slot, making the effective run time vary each day.
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:        # Allow manual trigger from the GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .agents/tools/commit-scheduler/requirements.txt

      - name: Configure git
        run: |
          git config user.name "heyncth"
          git config user.email "heyncth@users.noreply.github.com"

      - name: Generate commits
        run: |
          python .agents/tools/commit-scheduler/scheduler.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
